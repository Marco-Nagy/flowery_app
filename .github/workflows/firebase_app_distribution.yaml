name: Android Fastlane with Firebase App Distribution Workflow

# Trigger this workflow on push or pull requests to the 'development' branch
on:
  pull_request:
    branches:
      - development
  push:
    branches:
      - development

jobs:
  build:
    runs-on: ubuntu-latest # Use the latest Ubuntu runner

    steps:
      # Step 1: Checkout the repository code
      - name: Checkout code
        uses: actions/checkout@v3

      # Step 2: Setup Java 17 (required for Android builds)
      - name: Setup Java 17
        uses: actions/setup-java@v3
        with:
          distribution: temurin
          java-version: 17

      # Step 3: Set up Flutter environment
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      # Step 4: Create placeholder .env.firebase file (if required for Firebase)
      - name: Create placeholder .env.firebase
        run: echo "FIREBASE_CONFIG_PLACEHOLDER=true" > .env.firebase

      # Step 5: Decode and place google-services.json for Firebase integration
      - name: Decode and place google-services.json
        run: |
          echo "${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}" | base64 --decode > android/app/google-services.json

      # Step 6: Set up Firebase service account credentials
      - name: Set up Firebase service account credentials
        run: |
          echo "${{ secrets.FIREBASE_SERVICE_ACCOUNT_KEY }}" > $HOME/firebase-service-account.json
          export GOOGLE_APPLICATION_CREDENTIALS="$HOME/firebase-service-account.json"

      # Step 7: Save Firebase Server Token into firebase_server_token.dart
      - name: Save firebase_server_token.dart
        run: |
          echo "${{ secrets.FIREBASE_SERVER_TOKEN_RAW }}" > lib/core/services/firebase_notification/firebase_server_token.dart

      # Step 8: Bump version in pubspec.yaml
      - name: Bump Version in pubspec.yaml
        id: bump-version
        run: |
          VERSION=$(grep -oP 'version:\s*\K[0-9]+\.[0-9]+\.[0-9]+(?=\+)' pubspec.yaml)
          BUILD=$(grep -oP 'version:\s*[0-9]+\.[0-9]+\.[0-9]+\+\K[0-9]+' pubspec.yaml)

          NEW_VERSION=$(echo $VERSION | awk -F. '{print $1 "." $2 "." $3+1}')
          NEW_BUILD=$((BUILD+1))

          sed -i "s/version: $VERSION+$BUILD/version: $NEW_VERSION+$NEW_BUILD/" pubspec.yaml

          echo "New version: $NEW_VERSION+$NEW_BUILD"
          echo "version=$NEW_VERSION+$NEW_BUILD" >> $GITHUB_ENV

      # Step 9: Install project dependencies
      - name: Install Dependencies
        run: flutter pub get

      # Step 10: Clear Flutter build cache
      - name: Clear Flutter Build Cache
        run: flutter clean

      # Step 11: Build the release APK for production
      - name: Build APK for Production
        run: flutter build apk --release

      # Step 12: Distribute APK to Firebase App Distribution
      - name: Distribute APK to Firebase
        uses: wzieba/Firebase-Distribution-Github-Action@v1
        with:
          appId: ${{ secrets.FIREBASE_APP_ID }}
          file: build/app/outputs/flutter-apk/app-release.apk
          groups: maintainers
          releaseNotes: "First GitHub Action Firebase Distribution"
          debug: true
          serviceCredentialsFileContent: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_KEY }}
          firebaseServerToken: ${{ secrets.FIREBASE_SERVER_TOKEN }}

      # Step 13: Upload APK as an artifact for later use
      - name: Upload APK as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          debug: true
